name: APK yap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzelt
        run: cp app/build/outputs/apk/release/app-release.apk RetroLauncher.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sürüm ${{ github.run_number }}
          files: RetroLauncher.apk
          make_latest: true
